name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0

      - uses: gradle/actions/setup-gradle@v4

      - name: Test core logic
        run: ./gradlew :core:test --stacktrace

      - name: Prepare release key
        env:
          KEYSTORE_BASE64: ${{ secrets.CUSHION_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
            echo "CUSHION_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::No CUSHION_KEYSTORE_BASE64 secret. This APK is debug-signed, so updates will need a reinstall."
          fi

      - name: Build release APK
        env:
          CUSHION_KEYSTORE_PASSWORD: ${{ secrets.CUSHION_KEYSTORE_PASSWORD }}
          CUSHION_KEY_ALIAS: ${{ secrets.CUSHION_KEY_ALIAS }}
          CUSHION_KEY_PASSWORD: ${{ secrets.CUSHION_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Lint
        continue-on-error: true
        run: ./gradlew :app:lintRelease

      - uses: actions/upload-artifact@v4
        with:
          name: cushion-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
